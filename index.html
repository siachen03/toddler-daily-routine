 if(!weekend){
  if(day===0||day===4){events.find(e=>e.sourceId==='wd_0700').time='07:30';events.find(e=>e.sourceId==='wd_0800').time='08:30';events.find(e=>e.sourceId==='wd_1630').time='16:50';}
  events.push({id:`d${day}_school`,time:'09:00',end:(day===0||day===4)?'16:50':'16:30',title:'幼儿园的一天',en:'Kindergarten',emoji:'🏫',type:'school'});
 }
 const course=(time,end,title,en,emoji,type)=>({id:`d${day}_class`,time,end,title,en,emoji,type});
 if(day===1){events.find(e=>e.sourceId==='wd_1900').time='20:00';events.find(e=>e.sourceId==='wd_2000').time='20:30';events.push(course('19:00','20:00','英语课','English class','📚','course'));}
 if(day===5){events=events.filter(e=>e.sourceId!=='we_1700');events.push(course('16:50','18:00','舞蹈课','Dance class','🩰','dance'));}
 if(day===6){events=events.filter(e=>e.sourceId!=='we_1700');events.push(course('17:00','18:00','英语课','English class','📚','course'));}
 return events.sort((a,b)=>minutes(a.time)-minutes(b.time));
});}
const STORAGE='routine_weekly_v1';
let schedules=defaults(),done={},savedWeek='';
function weekKey(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,4000);}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({schedules,done,week:weekKey()}));}catch{notify('浏览器未能保存，关闭页面后修改可能丢失。');}}
function load(){try{const raw=JSON.parse(localStorage.getItem(STORAGE));const base=defaults();if(raw&&Array.isArray(raw.schedules)&&raw.schedules.length===7){schedules=base.map((day,i)=>day.map(item=>{const saved=raw.schedules[i]?.find(e=>e.id===item.id);return saved&&/^\d{2}:\d{2}$/.test(saved.time)&&minutes(saved.time)<1440&&(!item.end||(/^\d{2}:\d{2}$/.test(saved.end)&&minutes(saved.end)>minutes(saved.time)&&minutes(saved.end)<1440))?{...item,time:saved.time,...(item.end?{end:saved.end}:{})}:item;}));if(raw.week===weekKey()&&raw.done&&typeof raw.done==='object')done=raw.done;}}catch{/* Invalid or unavailable storage uses safe defaults. */}savedWeek=weekKey();}
function playTickSound(){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.frequency.value=1400;gain.gain.setValueAtTime(.05,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.05);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.05);}catch{}}
function setStep(n){currentStep=n;document.getElementById('step-label').textContent=n;document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===n)));playTickSound();}
function timeRange(e){return e.time+(e.end?'–'+e.end:'');}
function isCurrent(e,day,sorted,index){const now=new Date();if(day!==(now.getDay()+6)%7)return false;const min=now.getHours()*60+now.getMinutes();return min>=minutes(e.time)&&min<(e.end?minutes(e.end):sorted[index+1]?minutes(sorted[index+1].time):1440);}
function render(){
 document.querySelectorAll('.course-strip [data-open]').forEach(button=>{const e=findEvent(button.dataset.open);button.querySelector('span').textContent=timeRange(e);});
 document.getElementById('day-tabs').innerHTML=DAYS.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===selectedDay}" aria-label="${d}">${d}</button>`).join('');
 document.getElementById('calendar').innerHTML=schedules.map((events,day)=>{const sorted=[...events].sort((a,b)=>minutes(a.time)-minutes(b.time));return `<section class="day ${day>=5?'weekend':''} ${day===selectedDay?'selected':''} ${day===(new Date().getDay()+6)%7?'today':''}" aria-label="${DAYS[day]}"><div class="day-header"><span class="day-name">${DAYS[day]}${day===(new Date().getDay()+6)%7?'<small class="today-label">今天</small>':''}</span><span class="day-en">${EN_DAYS[day]}</span></div><div class="event-list">${sorted.map((e,i)=>`<article class="event ${e.type} ${done[e.id]?'done':''} ${isCurrent(e,day,sorted,i)?'current':''}" data-id="${e.id}"><button class="event-open" data-open="${e.id}" aria-label="${DAYS[day]} ${timeRange(e)} ${e.title}，查看详情"><span class="event-icon" aria-hidden="true">${e.emoji}</span><time class="event-time">${timeRange(e)}</time><span class="event-title">${e.title}</span><span class="event-en">${e.en}</span></button><div class="event-bottom"><span class="detail-hint">${e.type==='school'?'校内活动 ↗':'详情 / 调时间 ↗'}</span><button class="check" data-check="${e.id}" aria-label="${DAYS[day]} ${e.title}已完成" aria-pressed="${!!done[e.id]}">${done[e.id]?'✓':''}</button></div></article>`).join('')}</div></section>`;}).join('');
}
function findEvent(id){return schedules.flat().find(e=>e.id===id);}
function toggleTask(id){done[id]=!done[id];save();playTickSound();render();if(openedId===id)renderDialog();}
function adjustTime(id,direction){const e=findEvent(id),delta=direction*currentStep;const start=minutes(e.time)+delta,end=e.end?minutes(e.end)+delta:null;if(start<0||start>=1440||(end!==null&&end>=1440)){notify('时间需要保持在同一天内。');return;}e.time=clock(start);if(end!==null)e.end=clock(end);save();playTickSound();render();renderDialog();}
function getConversation(e){return CONVERSATIONS[e.sourceId]||(e.type==='school'?{mom:"Have a lovely day at school!",kid:"I will learn and play with my friends!"}:e.type==='dance'?{mom:"Time to dance! Let's move to the music.",kid:"Watch me twirl!"}:{mom:"Let's have fun learning English!",kid:"I'm ready! Let's learn together!"});}
function renderDialog(){const e=findEvent(openedId);if(!e)return;const day=Number(e.id[1]),conv=getConversation(e);const school=INITIAL_WEEKDAY.filter(x=>minutes(x.time)>=540&&minutes(x.time)<990);
 document.getElementById('event-content').innerHTML=`<div class="dialog-head"><div><span class="eyebrow">${DAYS[day]} · ${e.en}</span><h2 id="event-heading">${e.emoji} ${e.title}</h2></div><button class="close" data-close aria-label="关闭详情">×</button></div><div class="dialog-body"><div class="adjuster"><button class="round" data-adjust="-1" aria-label="提前 ${currentStep} 分钟">−</button><strong>${timeRange(e)}</strong><button class="round" data-adjust="1" aria-label="推迟 ${currentStep} 分钟">＋</button></div><p class="dialog-note">每次调整 ${currentStep} 分钟${e.end?' · 开始与结束时间一起移动，保持时长':''}</p>${e.type==='school'?`<section class="school-detail"><h3>在幼儿园做些什么？</h3>${school.map(x=>`<div class="school-row"><time>${x.time}</time><span>${x.emoji} ${CN[x.title]}</span></div>`).join('')}<p class="dialog-note" style="margin-top:10px">校内活动沿用原作息，仅作参考；放学时间以卡片为准。</p></section>`:''}<div class="phrase"><button class="speak" data-speak="mom" aria-label="播放家长英语对话">👩 🔊</button><p>${conv.mom}</p></div><div class="phrase"><button class="speak" data-speak="kid" aria-label="播放孩子英语对话">👧🏻 🔊</button><p>${conv.kid}</p></div><button class="full-btn" data-dialog-check>${done[e.id]?'✓ 已完成 · 点击取消':'□ 标记为已完成'}</button></div>`;
}
function openEvent(id){openedId=id;selectedDay=Number(id[1]);render();renderDialog();document.getElementById('event-dialog').showModal();}
function closeEvent(){document.getElementById('event-dialog').close();}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.step)setStep(Number(b.dataset.step));else if(b.dataset.day){selectedDay=Number(b.dataset.day);render();document.querySelector(`[data-day="${selectedDay}"]`)?.focus();}else if(b.dataset.open)openEvent(b.dataset.open);else if(b.dataset.check){const id=b.dataset.check;toggleTask(id);document.querySelector(`[data-check="${id}"]`)?.focus();}else if(b.hasAttribute('data-close'))closeEvent();else if(b.dataset.adjust){const direction=b.dataset.adjust;adjustTime(openedId,Number(direction));document.querySelector(`[data-adjust="${direction}"]`)?.focus();}else if(b.hasAttribute('data-dialog-check')){toggleTask(openedId);document.querySelector('[data-dialog-check]')?.focus();}else if(b.dataset.speak){const e=findEvent(openedId);speak(getConversation(e)[b.dataset.speak],b.dataset.speak);}else if(b.id==='reset')document.getElementById('reset-dialog').showModal();else if(b.id==='cancel-reset')document.getElementById('reset-dialog').close();else if(b.id==='confirm-reset'){schedules=defaults();done={};save();render();document.getElementById('reset-dialog').close();notify('已恢复七天的默认作息。');}});
document.getElementById('event-dialog').addEventListener('close',()=>{const id=openedId;openedId=null;if(window.speechSynthesis)speechSynthesis.cancel();document.querySelector(`[data-open="${id}"]`)?.focus();});
load();render();if('speechSynthesis' in window){voices=speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>voices=speechSynthesis.getVoices());}
setInterval(()=>{if(savedWeek!==weekKey()){savedWeek=weekKey();done={};save();}if(!document.querySelector('dialog[open]')&&!document.querySelector('button:focus'))render();},60000);

</script>
