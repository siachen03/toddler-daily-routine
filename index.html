function updateClock(){const now=new Date(),day=(now.getDay()+6)%7;document.getElementById('header-time').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');document.getElementById('header-date').textContent=language==='en'?now.toLocaleDateString('en-US',{month:'long',day:'numeric'}):`${now.getMonth()+1}月${now.getDate()}日`;const badge=document.getElementById('header-day');badge.textContent=dayLabel(day);badge.dataset.todayTheme=day>=5?'weekend':'weekday';badge.dataset.palette=String(day+1);}

const DEFAULT_SCHEDULES=structuredClone(DATA.schedules);
const schoolOverrides={},completed={};
const STORAGE_KEY='routine_age4_5_v1';
function weekKey(){const date=new Date();date.setDate(date.getDate()-(date.getDay()+6)%7);return `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;}
let recordWeek=weekKey();
function saveRecords(){try{const times=Object.fromEntries(WEEK_ORDER.flatMap(day=>events(day)).map(e=>[e.id,e.time]));localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,week:recordWeek,times,completed:Object.keys(completed).filter(id=>completed[id])}));}catch{const notice=document.getElementById('notice');notice.textContent=language==='en'?'Could not save records on this device':'当前设备未能保存记录';clearTimeout(move.timer);move.timer=setTimeout(()=>notice.textContent='',2500);}}
function loadRecords(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(saved?.version!==1)return;
  const validTime=value=>typeof value==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value);
  const knownIds=new Set(WEEK_ORDER.flatMap(day=>events(day)).map(e=>e.id));
  for(const day of DATA.schedules)for(const event of day){const time=saved.times?.[event.id];if(validTime(time))event.time=time;}
  for(let day=0;day<5;day++)DATA.school.forEach((event,i)=>{const id=`d${day}_school_${i}`,time=saved.times?.[id];if(validTime(time))schoolOverrides[id]={time};});
  if(saved.week===recordWeek&&Array.isArray(saved.completed))for(const id of saved.completed)if(knownIds.has(id))completed[id]=true;
 }catch{/* Invalid or unavailable storage falls back to the approved default routine. */}
}

function eventCard(e,day){return `<article class="event ${['course','dance'].includes(e.type)?'special-event':''} ${completed[e.id]?'done':''} ${day<5?(day===1&&e.type==='course'?'highlight-course':'fixed-routine'):''}" data-id="${e.id}"><div class="emoji" aria-hidden="true"><span>${icon(e)}</span></div><div class="event-content"><time class="time">${e.time}</time><span class="event-title">${eventLabel(e)}</span></div>${view==='day'?`<div class="actions"><div class="adjust"><button data-move="-1" data-event="${e.id}" data-eventday="${day}" aria-label="${language==='en'?`${dayLabel(day)} ${eventLabel(e)}, ${step} minutes earlier`:`${DATA.days[day]}${e.title}提前${step}分钟`}">−</button><button data-move="1" data-event="${e.id}" data-eventday="${day}" aria-label="${language==='en'?`${dayLabel(day)} ${eventLabel(e)}, ${step} minutes later`:`${DATA.days[day]}${e.title}推迟${step}分钟`}">＋</button></div><button class="check" data-check="${e.id}" aria-label="${language==='en'?`${dayLabel(day)} ${eventLabel(e)}, completed`:`${DATA.days[day]}${e.title}已完成`}" aria-pressed="${!!completed[e.id]}">${completed[e.id]?'✓':''}</button></div>`:''}</article>`;}

   return `<div class="schedule-cell ${matching.some(e=>['course','dance'].includes(e.type))?'course-highlight':''}" data-time="${time}" data-stripe="${row%2?'odd':'even'}" style="grid-row:${row+2}" ${matching.length?'':'aria-hidden="true"'}>${matching.map(e=>eventCard(e,day)).join('')}</div>`;
  }).join(''):list.map(e=>eventCard(e,day)).join('');
  return `<section class="day-column" data-palette="${day+1}" data-theme="${day>=5?'weekend':'weekday'}" style="--day-column:${column+1}" aria-label="${dayLabel(day)}"><h2 class="day-title">${weekdayHeading(day)}</h2><div class="event-list">${content}</div></section>`;
 }).join('');
}
function move(id,day,dir){const e=events(day).find(e=>e.id===id),time=m(e.time)+dir*step;if(time<0||time>=1440){const note=document.getElementById('notice');note.textContent=language==='en'?'Keep the time within this day':'时间需在同一天内';clearTimeout(move.timer);move.timer=setTimeout(()=>note.textContent='',2000);return;}const original=DATA.schedules[day].find(x=>x.id===id);if(original)original.time=t(time);else schoolOverrides[id]={time:t(time)};saveRecords();render();document.querySelector(`[data-event="${id}"][data-move="${dir}"]`)?.focus();}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const x=b.dataset;if(b.id==='reset-records'){resetRecords();}else if(x.language){language=x.language;render();document.querySelector(`[data-day="${selectedDay}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'});}else if(x.view){view=x.view;render();}else if(x.day!==undefined){selectedDay=Number(x.day);render();document.querySelector(`[data-day="${selectedDay}"]`)?.focus();}else if(x.step){step=Number(x.step);render();document.querySelector(`[data-step="${step}"]`)?.focus();}else if(x.move)move(x.event,Number(x.eventday),Number(x.move));else if(x.check){completed[x.check]=!completed[x.check];saveRecords();render();document.querySelector(`[data-check="${x.check}"]`)?.focus();}});loadRecords();render();

document.addEventListener("keydown",e=>{if(e.key==="Tab")document.body.dataset.input="keyboard";});
document.addEventListener("pointerdown",()=>{document.body.dataset.input="pointer";});

updateClock();setInterval(()=>{updateClock();if(recordWeek!==weekKey()){recordWeek=weekKey();for(const id of Object.keys(completed))delete completed[id];saveRecords();render();}},1000);

</script></body></html>
